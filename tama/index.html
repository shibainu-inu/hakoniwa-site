<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ハコニワ</title>
<meta name="description" content="ブラウザで育てる、箱のかたちのエージェント。">
<style>
:root{--bg:#161616;--card:#1f1f1f;--line:#2e2e2e;--fg:#f0ede6;--dim:#9a968e;--acc:#3b8cff;--warn:#f5a06e}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.7 "Noto Sans JP",system-ui,sans-serif}
main{max-width:520px;margin:0 auto;padding:16px}
header{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
header h1{font-size:18px;margin:8px 0;letter-spacing:.04em}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin:12px 0}
.stage{height:230px;display:flex;align-items:flex-end;justify-content:center;gap:12px;border-bottom:2px solid var(--line);margin-bottom:12px;overflow:hidden}
.stage svg{display:block;image-rendering:pixelated}
.hako{animation:bob 1.6s ease-in-out infinite}
.m-happy .hako{animation:jump .6s ease-in-out infinite}
.m-sad .hako{animation:droop 3s ease-in-out infinite;filter:saturate(.6)}
.m-eat .hako{animation:chew .3s steps(2) infinite}
.egg{animation:wobble .5s ease-in-out infinite}
.away{text-align:center;color:var(--dim)}
@keyframes bob{50%{transform:translateY(-4px)}}
@keyframes jump{50%{transform:translateY(-18px)}}
@keyframes droop{50%{transform:translateY(3px) rotate(-2deg)}}
@keyframes chew{50%{transform:scaleY(.96)}}
@keyframes wobble{25%{transform:rotate(-6deg)}75%{transform:rotate(6deg)}}
@media (prefers-reduced-motion:reduce){.hako,.egg,.m-happy .hako,.m-sad .hako,.m-eat .hako{animation:none}}
.status p{margin:2px 0}.name{font-weight:700}
.hearts{color:#f07c7c;letter-spacing:2px}.hearts .off{color:#3a3a3a}
.small{font-size:13px;color:var(--dim)}
.note{font-size:14px;color:var(--dim);border-left:3px solid var(--line);padding-left:8px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
button{font:inherit;background:var(--acc);color:#fff;border:0;border-radius:8px;padding:10px 16px;cursor:pointer;min-width:96px}
button:disabled{background:#333;color:#777;cursor:default}
label{display:block;margin:8px 0}
input[type=password]{display:block;width:100%;font:inherit;padding:8px;border-radius:6px;border:1px solid var(--line);background:#111;color:var(--fg)}
.link{display:inline;color:var(--acc);text-decoration:underline;cursor:pointer}
.bubble{background:var(--fg);color:#161616;border-radius:14px;padding:8px 12px;margin:8px 0}
.article{border:1px solid var(--line);border-radius:8px;padding:8px 12px;margin:8px 0}
.article h3{margin:0 0 4px;font-size:16px}.article p{margin:2px 0;font-size:14px}
.room svg{width:100%;height:auto;display:block;border-radius:8px;image-rendering:pixelated}
h2.h{font-size:16px;margin:0 0 8px}
button.sub{background:#2e2e2e;color:var(--fg)}
footer{font-size:12px;color:var(--dim);margin:24px 0}
</style></head>
<body><main>
<header><h1>ハコニワ</h1><span class="small">tama/0.2</span></header>
<div id="view"><section class="card"><p>読み込んでいます…</p><noscript>JavaScript を有効にしてください。</noscript></section></div>
<footer>PAPER はこの箱庭の中だけの点数で、お金としての価値はありません。鍵はあなたのブラウザの中だけにあります。</footer>
</main>
<script type="module">import { start } from "./tama_app.js"; start();</script>
</body></html>
